# kafka.properties for the CALLJ -> Kafka demo (read by com.demo.kafka.KafkaPublisher from the classpath)
# Every entry except demo.* is passed to the Kafka producer.
bootstrap.servers=localhost:9092
client.id=t24-callj
acks=all
max.block.ms=5000
request.timeout.ms=5000
delivery.timeout.ms=10000

# Default topic when the routine passes an empty topic
demo.topic=t24.callj.demo
# How long CALLJ waits for the Kafka acknowledgement
demo.send.timeout.ms=10000
